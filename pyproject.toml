# Python の Mod と Webhook の受け口のテスト用(サンプル自体は標準ライブラリと gakei_mod だけを使う)。
[project]
name = "gakei-mods-examples"
version = "0.1.0"
description = "Sample mods and webhook receivers for GAKEI"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    # テストで、GAKEI と同じ形の multipart の本文を組み立てるためだけに使う(通信はしない)。
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
